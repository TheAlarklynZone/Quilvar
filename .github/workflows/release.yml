name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Build Windows
    # Pinned: windows-latest moved to a newer Visual Studio release that this
    # project's bundled node-gyp doesn't recognize yet (fails "unsupported
    # version" during better-sqlite3's native rebuild even though VS is
    # present). windows-2022 matches what v0.1.0-v0.1.3 built successfully on.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync version and channel from tag
        shell: bash
        run: |
          TAG=${GITHUB_REF_NAME#v}
          npm version "$TAG" --no-git-tag-version
          # v0.1.6 -> channel "latest"; v0.1.6-A / v0.1.6-B -> channel "A" / "B".
          # electron-updater picks releases in the same channel as the app's
          # own currently-installed version, so this is what keeps an alpha
          # build only ever offering alpha updates, a beta build only beta,
          # and a stable build only stable.
          if [[ "$TAG" == *-* ]]; then CHANNEL="${TAG#*-}"; else CHANNEL="latest"; fi
          npm pkg set build.publish.channel="$CHANNEL"
          echo "Building $TAG on channel $CHANNEL"

      - name: Install dependencies
        run: npm install

      - name: Build Vite + Electron (Windows)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_build_from_source: 'true'
        run: npm run electron:build:win -- --publish never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            release/*.exe
            release/*.yml

  build-mac:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync version and channel from tag
        run: |
          TAG=${GITHUB_REF_NAME#v}
          npm version "$TAG" --no-git-tag-version
          if [[ "$TAG" == *-* ]]; then CHANNEL="${TAG#*-}"; else CHANNEL="latest"; fi
          npm pkg set build.publish.channel="$CHANNEL"
          echo "Building $TAG on channel $CHANNEL"

      - name: Install dependencies
        run: npm install

      - name: Build Vite + Electron (macOS)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_build_from_source: 'true'
        run: npm run electron:build:mac -- --publish never

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: |
            release/*.dmg
            release/*.yml

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync version and channel from tag
        run: |
          TAG=${GITHUB_REF_NAME#v}
          npm version "$TAG" --no-git-tag-version
          if [[ "$TAG" == *-* ]]; then CHANNEL="${TAG#*-}"; else CHANNEL="latest"; fi
          npm pkg set build.publish.channel="$CHANNEL"
          echo "Building $TAG on channel $CHANNEL"

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libsqlite3-dev

      - name: Install dependencies
        run: npm install

      - name: Build Vite + Electron (Linux)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_build_from_source: 'true'
        run: npm run electron:build:linux -- --publish never

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            release/*.AppImage
            release/*.deb
            release/*.yml

  release:
    name: Create GitHub Release
    needs: [build-windows, build-mac, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Determine prerelease flag
        id: prerelease
        run: |
          # v0.1.6 -> stable release; v0.1.6-A / v0.1.6-B (or any -suffix) ->
          # marked as a GitHub prerelease so stable installs (which check
          # GitHub's "latest release" endpoint, which excludes prereleases)
          # never see it as an update.
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          prerelease: ${{ steps.prerelease.outputs.value }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
